<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ghost Node Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
<script src="/static/screens/overview.js" defer></script>
<script src="/static/screens/rewards.js" defer></script>
<script src="/static/screens/network.js" defer></script>
<script src="/static/screens/settings.js" defer></script>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <a class="brand" href="#/overview">
    <svg class="logo" viewBox="0 0 100 100" width="36" height="36" role="img" aria-label="Ghost">
      <g fill="#0E0D1A">
        <rect x="0" y="0" width="26" height="26"/>
        <rect x="37" y="0" width="26" height="26"/>
        <rect x="74" y="0" width="26" height="26"/>
        <rect x="0" y="37" width="26" height="26"/>
        <rect x="74" y="37" width="26" height="26"/>
        <rect x="0" y="74" width="26" height="26"/>
        <rect x="37" y="74" width="26" height="26"/>
        <rect x="74" y="74" width="26" height="26"/>
      </g>
      <path fill="#6B4CFF" d="M37 50a13 13 0 0 1 26 0v13l-6.5-5.2-6.5 5.2-6.5-5.2-6.5 5.2z"/>
    </svg>
    <span class="brand-name">ghost</span>
    <span class="brand-node">node</span>
  </a>
  <nav class="nav" aria-label="Screens">
    <ul>
      <li><a href="#/overview" data-route="overview">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Overview</span></a></li>
      <li><a href="#/rewards" data-route="rewards">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10.5h4.5a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3H15"/></svg>
        <span>Rewards</span><span class="badge mono" id="nav-rewards-badge" hidden></span></a></li>
      <li><a href="#/network" data-route="network">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M11 7 6 17M13 7l5 10M7 19h10"/></svg>
        <span>Network</span></a></li>
      <li><a href="#/settings" data-route="settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Settings</span></a></li>
    </ul>
  </nav>
  <section class="node-card" aria-label="Node">
    <p class="node-state"><span class="dot" id="side-dot"></span><span id="side-state">Checking…</span></p>
    <p class="node-line" id="side-network">–</p>
    <p class="node-line mono" id="side-version">–</p>
    <p class="node-line mono" id="side-chain">–</p>
  </section>
</aside>
<main class="content" id="main"></main>
</div>
</body>
</html>
